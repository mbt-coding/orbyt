  $("sa").textContent=A;$("sc").textContent=q>0?"+"+q:q<0?"−"+(-q):"0";
  $("sf").textContent=shells(e).join("·")||"—";
  $("sm").textContent=(p*1.00728+n*1.00866+e*.000549).toFixed(2)+" u";
}
const N_=(p,n)=>"N/Z "+(n/Math.max(p,1)).toFixed(2);
function set(k,v){const mx={p:140,n:180,e:130};S[k]=Math.max(k==="p"?0:0,Math.min(mx[k],v));build()}

document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>set(b.dataset.k,S[b.dataset.k]+ +b.dataset.d));
$("neu").onclick=()=>set("e",S.p);
$("iso").onclick=()=>{S.n=ideal(S.p);build()};
$("rnd").onclick=()=>{S.p=1+Math.floor(Math.random()*92);S.n=ideal(S.p)+Math.floor(Math.random()*5-2);S.e=S.p+(Math.random()<.4?Math.floor(Math.random()*5-2):0);S.n=Math.max(0,S.n);S.e=Math.max(0,S.e);build()};
$("rst").onclick=()=>{S.p=1;S.n=0;S.e=1;build()};
[["H",1],["C",6],["O",8],["Ne",10],["Na",11],["Fe",26],["Ag",47],["Au",79],["U",92],["Og",118]].forEach(([s,z])=>{
  const b=document.createElement("button");b.textContent=s;b.title=EL[z-1][1];b.onclick=()=>{S.p=z;S.n=ideal(z);S.e=z;build()};$("pre").appendChild(b)});
const tog={tr:1,tg:1,ta:1,tp:1};
["tr","tg","ta","tp"].forEach(k=>$(k).onclick=()=>{tog[k]=!tog[k];$(k).classList.toggle("on",!!tog[k]);ring_vis();glow_vis()});
let speed=1;$("sp").oninput=e=>speed=+e.target.value;

// orbit controls
let th=.6,ph=1.2,dist=16,distT=16,drag=null,pin={};
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pin[e.pointerId]=[e.clientX,e.clientY];drag=1;cv.style.cursor="grabbing"});
cv.addEventListener("pointerup",e=>{delete pin[e.pointerId];if(!Object.keys(pin).length){drag=null;cv.style.cursor="grab"}});
cv.addEventListener("pointermove",e=>{
  const o=pin[e.pointerId];if(!o)return;const ids=Object.keys(pin);
  if(ids.length===2){const [a,b]=ids.map(i=>pin[i]);const d0=Math.hypot(a[0]-b[0],a[1]-b[1]);pin[e.pointerId]=[e.clientX,e.clientY];const [c,d]=ids.map(i=>pin[i]);const d1=Math.hypot(c[0]-d[0],c[1]-d[1]);distT=clamp(distT*d0/d1,4,120);return}
  th-=(e.clientX-o[0])*.007;ph=clamp(ph-(e.clientY-o[1])*.007,.15,3);pin[e.pointerId]=[e.clientX,e.clientY]});
cv.addEventListener("wheel",e=>{e.preventDefault();distT=clamp(distT*(1+e.deltaY*.001),4,120)},{passive:false});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function sv(id,v){const el=$(id);if(document.activeElement!==el)el.value=v}
let off={x:0,y:0,k:1},offT={x:0,y:0,k:1};
function layout(){
  const W=innerWidth,H=innerHeight,P=$("ui"),r=P.getBoundingClientRect(),m=P.classList.contains("min");
  const side=matchMedia("(min-width:900px),(max-height:500px) and (orientation:landscape)").matches;
  if(side){const fw=m?W:Math.max(160,W-r.right-12);offT.x=m?0:(r.right+12)/2;offT.y=0;offT.k=Math.max(1,H/fw*1.05)}
  else{const fh=Math.max(120,r.top);offT.x=0;offT.y=(H-fh)/2;offT.k=Math.max(1,H/fh*1.1)}
}
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();layout()}
addEventListener("resize",resize);resize();

let boom=null;
function endBoom(){if(!boom)return;boom.objs.forEach(o=>{if(o.parent)o.parent.remove(o)});boom=null;shG.visible=true;nucGlow.visible=!!tog.tg;L1.intensity=1.4}
function rv(){return new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5)}
function explode(){
  const objs=[],bits=[];
  const grab=(m,k)=>{root.attach(m);objs.push(m);const d=m.position.clone();if(d.lengthSq()<1e-6)d.copy(rv());d.normalize().add(rv().multiplyScalar(.8)).normalize();bits.push({m,v:d.multiplyScalar((k?16:9)*(.4+Math.random()*1.2)),w:rv().multiplyScalar(10)})};
  els.forEach(o=>o.em.position.set(Math.cos(o.a)*o.rad,0,Math.sin(o.a)*o.rad));[...nuc.children].forEach(m=>grab(m,0));els.forEach(o=>grab(o.em,1));
  shG.visible=false;nucGlow.visible=false;
  const N=900,pa=new Float32Array(N*3),pc=new Float32Array(N*3),pv=new Float32Array(N*3),pf=new Float32Array(N);
  for(let i=0;i<N;i++){const d=rv().normalize().multiplyScalar(3+Math.random()*28);pv.set([d.x,d.y,d.z],i*3);pf[i]=.4+Math.random()*.6}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pa,3));g.setAttribute("color",new THREE.BufferAttribute(pc,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({size:1.4,map:glowTex("rgba(255,190,110,"),vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));pts.frustumCulled=false;
  const flash=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex("rgba(255,235,200,"),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
  const wave=new THREE.Mesh(new THREE.SphereGeometry(1,32,20),new THREE.MeshBasicMaterial({color:0xffb070,wireframe:true,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false}));
  root.add(pts,flash,wave);objs.push(pts,flash,wave);
  boom={t:0,objs,bits,pts,pv,pf,N,flash,wave};
}
function stepBoom(dt){
  const b=boom;b.t+=dt;const t=b.t;if(t>7)return;
  L1.intensity=1.4+Math.max(0,1-t*1.5)*40;
  b.bits.forEach(o=>{o.m.position.addScaledVector(o.v,dt);o.v.multiplyScalar(1-.5*dt);o.m.rotation.x+=o.w.x*dt;o.m.rotation.y+=o.w.y*dt;if(t>5)o.m.scale.multiplyScalar(Math.max(0,1-dt*2.5))});
  const a=b.pts.geometry.attributes.position.array,c=b.pts.geometry.attributes.color.array,k=clamp(1-t/4,0,1);
  for(let i=0;i<b.N;i++){for(let j=0;j<3;j++){a[i*3+j]+=b.pv[i*3+j]*dt;b.pv[i*3+j]*=1-1.1*dt}const f=b.pf[i]*k;c[i*3]=f;c[i*3+1]=f*f*.75;c[i*3+2]=f*f*f*.3}
  b.pts.geometry.attributes.position.needsUpdate=true;b.pts.geometry.attributes.color.needsUpdate=true;
  b.flash.material.opacity=clamp(1.2-t/.9,0,1);b.flash.scale.setScalar(8+t*70);
  b.wave.scale.setScalar(1+t*32);b.wave.material.opacity=clamp(.55-t/2.2,0,.55);
}
let last=performance.now(),T=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(boom)stepBoom(dt);else if(tog.tp){T+=dt;
    els.forEach(o=>{o.a+=o.w*dt*speed;o.em.position.set(Math.cos(o.a)*o.rad,0,Math.sin(o.a)*o.rad)});
    nucs.forEach(o=>{const j=.04*Math.sin(T*9+o.ph);o.m.position.set(o.base.x+j*Math.sin(o.ph*3),o.base.y+j*Math.cos(o.ph*2),o.base.z+j)});
    nucGlow.material.opacity=.55+.15*Math.sin(T*3)}
  if(tog.ta&&!drag)th+=dt*.12;
  dist+=(distT-dist)*.08;for(const k in off)off[k]+=(offT[k]-off[k])*.12;cam.setViewOffset(innerWidth,innerHeight,-off.x,off.y,innerWidth,innerHeight);
  cam.position.set(dist*off.k*Math.sin(ph)*Math.sin(th),dist*off.k*Math.cos(ph),dist*off.k*Math.sin(ph)*Math.cos(th));cam.lookAt(0,0,0);if(boom&&boom.t<1.4){const s=(1.4-boom.t)*.9;cam.position.x+=(Math.random()-.5)*s;cam.position.y+=(Math.random()-.5)*s;cam.position.z+=(Math.random()-.5)*s}
  const ch=Math.min(1,Math.abs(S.p-S.e)/6);
  mE.color.setHex(S.e>S.p?0xb08cff:S.e<S.p?0xffd37f:0x7fe0ff);
  R.render(sc,cam);requestAnimationFrame(loop)}
(function(){
  const P=$("ui"),h=P.querySelector("h1");
  h.onclick=()=>P.classList.toggle("min");
  new ResizeObserver(layout).observe(P);
  $("hint").textContent="drag to orbit · scroll or pinch to zoom · tap any number to type it";
  [["vp","p",140],["vn","n",180],["ve","e",130]].forEach(([id,k,mx])=>{const el=$(id);
    el.addEventListener("focus",()=>el.select());
    el.addEventListener("input",()=>{let v=el.value.replace(/\D/g,"");if(v!==""){v=Math.min(mx,+v);set(k,v)}el.value=v});
    el.addEventListener("blur",()=>{el.value=S[k]});
    el.addEventListener("keydown",e=>{if(e.key==="Enter")el.blur();if(e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();set(k,S[k]+(e.key==="ArrowUp"?1:-1));el.value=S[k]}})});
  const f=document.createElement("input");f.id="find";f.placeholder="Search element: name, symbol or number";f.setAttribute("list","els");f.autocomplete="off";
  const dl=document.createElement("datalist");dl.id="els";
  EL.forEach((x,i)=>{const o=document.createElement("option");o.value=x[1];o.label=x[0]+" · "+(i+1);dl.appendChild(o)});
  h.after(f,dl);
  const go=()=>{const v=f.value.trim().toLowerCase();if(!v)return;
    const z=/^\d+$/.test(v)?+v:(EL.findIndex(x=>x[0].toLowerCase()===v)+1||EL.findIndex(x=>x[1].toLowerCase().startsWith(v))+1);
    if(z>=1&&z<=140){S.p=z;S.n=ideal(z);S.e=z;build();f.value="";f.blur()}else{f.classList.add("err");setTimeout(()=>f.classList.remove("err"),600)}};
  f.onchange=go;f.onkeydown=e=>{if(e.key==="Enter")go()};
  document.querySelectorAll("[data-k]").forEach(b=>{
    b.onclick=null;let t,iv;
    const step=()=>set(b.dataset.k,S[b.dataset.k]+ +b.dataset.d);
    const stop=()=>{clearTimeout(t);clearInterval(iv)};
    b.addEventListener("pointerdown",e=>{e.preventDefault();step();t=setTimeout(()=>{iv=setInterval(step,70)},420)});
    ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,stop));
    b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();step()}});
    b.title=({p:"Proton",n:"Neutron",e:"Electron"})[b.dataset.k]+(b.dataset.d>0?" +":" −")+Math.abs(b.dataset.d)+" (hold to repeat)";
  });
})();
build();requestAnimationFrame(loop);
